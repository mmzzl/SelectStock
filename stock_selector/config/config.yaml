mongodb:
  host: "127.0.0.1"
  port: 27017
  database: "eastmoney_news"
  collection: "news"
spider:
  progress_file: "spider_progress.json"

# 新闻解读 LLM 配置（scripts/analyze_news_llm.py）
# 使用智谱 zai-sdk（model 用 GLM-4.7-Flash）。api_key 留空时回退读环境变量 ZHIPU_API_KEY。
llm:
  provider: "zhipu"
  api_key: "b4a8f1a0c69e47cc992337b6d6e8fe7c.7k5N2p64E2lH6hfF"
  model: "GLM-4.5-Flash"
  temperature: 0.3
  max_tokens: 2048
  timeout: 60

# 公告下载配置（scripts/notice_spider_cninfo.py / notice_tracker.py）
notice:
  track_dir: "data/downloaded_notices"   # bitmap 去重跟踪目录(文件版,备用)
  detail_dir: "data/notices"             # 公告PDF落盘目录（按股票代码分目录）
  bucket_bits: 20                        # 文件位图每桶 bit 数(2^20=128KB/桶,备用)
  log_dir: "logs"                        # 日志输出目录
  request_interval: 0.5                  # 爬取频率：相邻请求最小间隔(秒)
  request_jitter: 0.2                    # 间隔随机抖动(±秒)，降低反爬特征
  crawl:
    columns: ["szse", "sse"]             # 巨潮公告列表板块：深市/沪市
    from_date_offset_days: 1             # 默认增量：最近N(=1)天
    max_pages_per_day: 30                # 单日每板块列表最大翻页数(截断保护)
  redis:
    host: "127.0.0.1"                    # 只本机访问
    port: 6379
    db: 0

app:
  name: "News API"
  version: "1.0.0"
  description: "A FastAPI application for news data management"

jwt:
  secret: "your-secret-key-change-in-production-2026"
  algorithm: "HS256"
  access_token_expire_minutes: 30
