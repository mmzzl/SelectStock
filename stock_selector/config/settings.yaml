# 插件化量化选股系统 - 全局配置
# 配置项分为三类：全局配置、数据源配置、策略参数

# 数据源配置
# type: parquet => 本地指标宽表 data/stock_kline（离线、与回测/诊断同源，默认）
#       mongo   => 直连 MongoDB stock_kline（行情最新，但单只冷读约 0.5s，全市场需 40 分钟，只宜少量代码）
#       ak      => akshare 行情接口（需可访问外网；本机实测东财接口已不可达）
#       mock    => 内置模拟数据（仅演示/测试）
# 切换数据源不影响选股策略代码
datasource:
  type: parquet
  # 本地指标宽表源（由 scripts/build_kline_features.py 生成，注意数据新鲜度）
  parquet:
    dir: "data/stock_kline"
    # 剪列读取：6 列+120 行全市场约 160s；列越多越慢（宽表现共 82 列），
    # 指标/形态类策略一律由 required_columns() 声明，内核按并集自动补齐，不必改这里
    columns: ["date", "open", "high", "low", "close", "volume"]
    rows: 120            # 只取最近 N 个交易日（均线/箱体策略够用；0=全量）
  # MongoDB 日线源：连接参数缺省时读 config/config.yaml 的 mongodb 节
  mongo:
    rows: 120
  # akshare 行情接口参数
  ak:
    start_date: "20240101"
    adjust: "qfq"          # 前复权
    # 单次拉取 K 线数量，不宜过大以免超时
    fetch_rows: 300

# 策略执行配置
selector:
  # 默认执行全部策略；可通过命令行/接口参数指定策略名称覆盖
  default_strategies: ["trend_rebound", "box_oscillate"]
  # 单股票处理失败时是否继续（稳定性保证）
  tolerate_errors: true
  # 股票池数量上限（0 表示不限制）
  stock_limit: 0
  # 选股池按名字剔除的关键词（命中即跳过，不进策略、不判风险分）。
  # 为什么剔：货币/债券 ETF 日波动近乎为零，天然"完美符合"箱体突破与趋势回踩的判据，
  #   会把 rank 头部整段占满——2026-10-11 实跑 trend_rebound 的 #1~#5 全是货币ETF
  #   （511860/511800/511650/511690/511900），预期10日超额只有 -0.16~+0.01pp，等于"跟着大盘走"，
  #   对选股毫无意义。它们进本地数据是为了持仓取价，不是为了当选股对象。
  # 为什么是这几个词（按 data/stock_kline 全 6631 只真实名字核过）：
  #   货币 19 只、含"债" 52 只（国债/地方债/信用债/公司债/城投/政金债/科创债/可转债）、
  #   日利/添益/快线各 1 只（银华日利、华宝添益、招商快线——名字里不带"货币"的货币ETF）。
  #   股票里没有任何名字含这些词，误伤为零。
  # 2026-10-11 补：短融/日鑫/天天金/添利/财富宝/增益——同一批 511xxx 里的货币与短融债基，
  #   名字里不带"货币/债"（511360 短融ETF、511600 华安日日鑫、511670 华泰天天金、
  #   511820 鹏华添利、511850 招商财富宝），首次实跑仍窜到 rank #12/#21。各词在全 6631 只里
  #   只命中这一只，误伤同样为零。
  # ⚠️ 别加"现金"：现金流ETF / 自由现金流ETF 是**股票型**指数基金（自由现金流因子），
  #   30 只是正常选股对象，被"现金"二字命中就错了。
  # 可转债ETF 一并剔：它是债券基金，只是跟股市相关性强。
  # 2026-10-12 加 "ST"：风险警示股不是选股对象——涨跌停口径特殊、可能退市、流动性靠情绪。
  #   按 data/market_snapshot 全 6631 只真实名字核过：含大写 "ST" 的正好 201 只，且**全部**是
  #   "ST"/"*ST" 前缀（非前缀命中 0 只），股票名里没有别的词带这两个字母，误伤为零。
  #   顺手解决一个悬了很久的口径问题：接口给的 ST 涨跌停是主板 10% / 创业与科创 20%，
  #   没有 5% 那一档，而风控层本来就取交易所原值（见 risk/rules.py），所以不用为 ST 加特例。
  exclude_name_keywords: ["货币", "债", "日利", "添益", "快线",
                          "短融", "日鑫", "天天金", "添利", "财富宝", "增益", "ST"]

# ── 风控层：信号之后、最终决策之前（策略只产生信号，不等于一定要下单）──────────────
# 见 stock_selector/risk/：十条规则按「涨跌停 → T+1 → 同族翻面 → 买入名额 → 流动性 → 单票仓位 → 可用资金 → 滑点 → 风险分 → ADX 分位」
# 顺序执行，命中即短路，每条都出中文理由，告警链路要把「为什么没推」原样说给用户。
risk:
  enabled: true
  # 单票仓位上限口径 = 总资金 × 上限比例（本系统只做建议，不接券商下单）。
  # capital 是账户总资金（元），改了它建议股数就跟着变；未配置时内核按 20 万兜底并留日志。
  capital: 200000
  max_position_pct: 0.2
  # 流动性：近 20 日日均成交额（元）。低于这个量的票盘口薄，一笔普通单子就打穿，
  # 信号再好看也吃不到——实测 3000 万是「5 万元单子占用 < 0.2%」的分界。
  min_avg_amount: 30000000
  max_participation: 0.02      # 单笔下单额占日均成交额上限（超过说明这单本身就该拆）
  # 滑点预估 = 半价差 + 冲击成本 + 信号价漂移（万分比，1bp=0.01%）。
  # 免费快照有延迟，看到的价格不一定成交得到，所以估出来复核一遍再放行。
  max_slippage_bp: 100
  max_drift_bp: 200            # 信号价与最新价偏离上限：差太多就是「按信号价下不到单」
  min_spread_bp: 2             # 拿不到五档时的半价差下限（别把价差当 0，那是白送成交）
  probe_order_amount: 50000    # 未折算出下单量时，滑点用这个探测单额估冲击成本
  use_limit: true              # 涨跌停可成交性：涨停买不进、跌停卖不出
  # A 股 T+1 且账户资金有限：光看单只票的口径会给出一堆「执行不了的建议」，所以风控还管
  # 「今天这一笔做不做得成」。三条判据要的输入（名次/今日买入成交/可用资金）只有盘中链路
  # 从 app.db 拿得到，盘后内核拿不到 → 一律放行并留 skipped 指标，选股结果不受影响。
  t_plus_1: true               # 今日有买入成交的股票，当天不给卖出建议（明天才卖得掉）
  cash_check: true             # 买入金额超出当日可用资金就压到剩余额度（不够一手则 block）
  # max_buy_codes：一天最多几只买入下单建议（按当日盯盘名单名次取前 N，0=不限）。
  # 只在盘中进程上配：scripts/intraday_engine.py --max-buy-codes（默认 3）会覆盖这里，
  # 因为盘后内核产的是名单不是订单，不限只数才是对的。
  max_buy_codes: 0
  # flip_cooldown：同一个指标（盘口托单/压单、均线金叉/死叉这类镜像对）在这秒数内翻了面，
  # 第二条按抖动拦掉。实测 2026-10-22 09:30:12 压单放行卖出、09:30:48 托单放行买入，
  # 两条进了同一条钉钉消息——同一只票同一分钟既喊卖又喊买，用户只能关掉通知。
  # 只在盘中有效：盘后内核不传 family，这条规则自己放行。0 = 关闭。
  flip_cooldown: 1800
  # 买入风险分（原来挂在 selector.risk_filter 下，现归入风控层的最后一条规则）：对已命中的
  # 票做**剔除**（不做排序）。模型预测"今日收盘买入、持有 10 日的同日基线超额收益"，
  # 低于阈值的不推荐买入。
  # 为什么开：这套研究里唯一过了"年代 + 四子时期"双签、且**扣掉自身换手成本仍为正**的结果。
  #   - trend_rebound 命中池（1710 只、2019-2026）：不加闸门 10 日超额 -0.18pp → 加闸门 +0.14pp，
  #     配对提升 +0.28pp/10 日（t=+5.7），8 个年度全为正；
  #   - 全市场持有 10 日的组合年化：剔掉预测分最低 30% 一档，8 年里 7 年为负的那批不再买入，
  #     毛收益 +5.4%/年，且对成本档不敏感（剔除不增加换手）。
  # 为什么只做剔除：高分腿是「超跌/低位风格 β」（2020-21 核心资产抱团期系统性亏），不是 α，
  #   且毛 α 9~12%/年 < 25bp/边下的换手成本 12%/年 → 不做排序、不做买点、不进默认策略列表。
  # 代价：parquet 源多读 ~45 列、回溯 700 根（原 6 列/120 行），全市场选股耗时上升。
  # 依赖 data/models/risk_ex10.*，缺失时引擎 preflight() 直接 RuntimeError（不静默放行）。
  # adx14 闸门（第 6 条，分母是**当日全市场**而不是它自己）。
  # 默认关：它是按 README《结论卡：adx14 高分位闸门》的准入测出来的，不是开箱即用项。
  #   实测（universe 1500、分母=全市场）：九格单笔期望全为正 +128.8~+1171.3 元/笔，
  #   相对对照的配对改进九格同号（d胜率 +3.1~+32.4pp、d期望 +27.9~+994.6 元）。
  #   撮合仍是「信号日收盘成交」口径，没有改成次晨开盘——偏差在实盘手册与 shadow 台账里观测。
  # mode=shadow：只把「这只会不会被剔掉」写进决策 metrics，**不改变下单**。
  #   灰度要的就是同一批信号上「剔/不剔」的对照，所以它必须记录、但不能真的拦。
  # mode=live：低于 min_pct 就 block。切 live 之前请确认 shadow 台账已核验通过。
  adx14_rank:
    enabled: true
    mode: "shadow"
    factor: "adx14"
    min_pct: 90
  ml:
    enabled: true
    model_dir: "data/models"

# ── 盘中计算引擎（scripts/intraday_engine.py）：tick → 分钟指标 → 信号 → 上面那套风控 ──
# 参数一律是「分钟」口径上的阈值，判完的信号仍走 risk: 的十条规则，不另开一套风控。
intraday:
  interval: 5                  # 读 rt:ticks 的间隔（秒），与轮询服务同拍
  read_batch: 2000             # 一轮最多读多少条 tick
  max_eval: 300                # 一轮最多给多少只算 talib 指标（全市场盘中的自我限流阀）
  once_per_day: true           # 同票同信号当天只报一次（买入/卖出同口径），跨天才重新放开
  cooldown: 300                # 重复抑制窗口（秒）：once_per_day 关掉、或 redis 去重表写不进时的退路
  replay_horizon: 60           # 比现在旧过这个秒数的 tick 只补分钟条、不产信号
  flow_window: 5               # 打单流入的滚动窗口（分钟）
  kline_cache: 32              # 日线宽表 LRU 只数（流动性/风险分/压力位共用）
  # 卖出方向只对持仓里的代码判定（`signals.View.held`，引擎按池的持仓市值给出）：
  # 池子绝大多数是当天选出来的票，给没持有的票推卖出执行不了，也只是刷屏。这里没有开关，
  # 因为它不是可调的阈值，而是「卖」这个字的定义。
  # 信号阈值：换手、量比这类「多大算大」是主观口径，所以全部暴露在这里而不是写死在代码里
  signals:
    min_bars: 60               # 分钟条预热：不足 60 根只跑价格类信号，不给半温的均线
    vol_ratio: 3.0             # 量比 ≥ 这个数才算放量
    turnover_pct: 10.0         # 换手率（百分数）到这个水位算高换手（对持仓是风险信号）
    blast_mult: 2.0            # 单分钟量 / 5 分钟均量
    minute_move_pct: 1.0       # 单分钟涨跌幅门槛（百分数，正负各判一次）
    day_drop_pct: -5.0         # 当日跌幅 + 量比 ≥ day_vol_ratio → 放量大跌
    day_vol_ratio: 2.0
    breakout_bp: 20.0          # 上穿 res20 / 跌破 sup20 的确认幅度（万分比），防盘口噪音反复触发
    rsi_oversold: 30.0
    rsi_overbought: 70.0
    inflow_amount: 5000000     # 主动净买入额（元）触发打单流入信号
    book_ratio: 2.0            # 五档买量/卖量 ≥ 这个倍算托单，≤ 其倒数算压单
    kinds: null                # 白名单：给了就只跑列出的种类（见 intraday/signals.py 的 KINDS）

# 策略参数（各策略插件可通过 self.config 读取）
strategy_params:
  # 趋势回踩策略
  trend_rebound:
    period: 20            # 均线周期
    pullback_pct: 0.05    # 回踩幅度（5%）
  # 箱体震荡策略
  box_oscillate:
    period: 30            # 箱体统计周期
    breakout_pct: 0.02    # 突破阈值（2%）
  # 低位反转策略（v_reversal 列来自 parquet 预计算，见 README《形态与量能列》）
  pattern_reversal:
    max_pos60: 0.35       # 「形态看位置」：60 日分位高于此不认，跌透之后的回升才叫反转

# HTTP 服务配置
server:
  host: "0.0.0.0"
  port: 8000
