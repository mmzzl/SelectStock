# 插件化量化选股系统 - 全局配置
# 配置项分为三类：全局配置、数据源配置、策略参数

# 数据源配置
# type: parquet => 本地指标宽表 data/stock_kline（离线、与回测/诊断同源，默认）
#       mongo   => 直连 MongoDB stock_kline（行情最新，但单只冷读约 0.5s，全市场需 40 分钟，只宜少量代码）
#       ak      => akshare 行情接口（需可访问外网；本机实测东财接口已不可达）
#       mock    => 内置模拟数据（仅演示/测试）
# 切换数据源不影响选股策略代码
datasource:
  type: parquet
  # 本地指标宽表源（由 scripts/build_kline_features.py 生成，注意数据新鲜度）
  parquet:
    dir: "data/stock_kline"
    # 剪列读取：6 列+120 行全市场约 160s；列越多越慢（宽表现共 82 列），
    # 指标/形态类策略一律由 required_columns() 声明，内核按并集自动补齐，不必改这里
    columns: ["date", "open", "high", "low", "close", "volume"]
    rows: 120            # 只取最近 N 个交易日（均线/箱体策略够用；0=全量）
  # MongoDB 日线源：连接参数缺省时读 config/config.yaml 的 mongodb 节
  mongo:
    rows: 120
  # akshare 行情接口参数
  ak:
    start_date: "20240101"
    adjust: "qfq"          # 前复权
    # 单次拉取 K 线数量，不宜过大以免超时
    fetch_rows: 300

# 策略执行配置
selector:
  # 默认执行全部策略；可通过命令行/接口参数指定策略名称覆盖
  default_strategies: ["trend_rebound", "box_oscillate"]
  # 单股票处理失败时是否继续（稳定性保证）
  tolerate_errors: true
  # 股票池数量上限（0 表示不限制）
  stock_limit: 0
  # 买入风险分：对已命中的票做**剔除**（不做排序）。模型预测"今日收盘买入、持有 10 日
  # 的同日基线超额收益"，低于阈值的不推荐买入。
  # 为什么开：这套研究里唯一过了"年代 + 四子时期"双签、且**扣掉自身换手成本仍为正**的结果。
  #   - trend_rebound 命中池（1710 只、2019-2026）：不加闸门 10 日超额 -0.18pp → 加闸门 +0.14pp，
  #     配对提升 +0.28pp/10 日（t=+5.7），8 个年度全为正；
  #   - 全市场持有 10 日的组合年化：剔掉预测分最低 30% 一档，8 年里 7 年为负的那批不再买入，
  #     毛收益 +5.4%/年，且对成本档不敏感（剔除不增加换手）。
  # 为什么只做剔除：高分腿是「超跌/低位风格 β」（2020-21 核心资产抱团期系统性亏），不是 α，
  #   且毛 α 9~12%/年 < 25bp/边下的换手成本 12%/年 → 不做排序、不做买点、不进默认策略列表。
  # 代价：parquet 源多读 ~45 列、回溯 260 根（原 6 列/120 行），全市场选股耗时上升。
  # 依赖 data/models/risk_ex10.*，缺失时 _risk_gate 直接 RuntimeError（不静默放行）。
  risk_filter:
    enabled: true
    model_dir: "data/models"

# 策略参数（各策略插件可通过 self.config 读取）
strategy_params:
  # 趋势回踩策略
  trend_rebound:
    period: 20            # 均线周期
    pullback_pct: 0.05    # 回踩幅度（5%）
  # 箱体震荡策略
  box_oscillate:
    period: 30            # 箱体统计周期
    breakout_pct: 0.02    # 突破阈值（2%）
  # 低位反转策略（v_reversal 列来自 parquet 预计算，见 README《形态与量能列》）
  pattern_reversal:
    max_pos60: 0.35       # 「形态看位置」：60 日分位高于此不认，跌透之后的回升才叫反转

# HTTP 服务配置
server:
  host: "0.0.0.0"
  port: 8000
