; 盘中决策告警（`rt:decisions` → 钉钉/企业微信摘要；只推送，不调券商接口）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; 密钥：ALERT_WEBHOOK_URL / ALERT_WEBHOOK_SECRET 是机器人凭据，**只写在 /etc 里那份**，
;       仓库这份留空并 autostart=false —— 填好真值再把 autostart 改成 true。
;       它和后端 notify_channels.json 的推送渠道是两套：那套走 8010 的通知服务，这套是盘中链路。
; 默认从流尾开始（不重推启动前的决策）；要补发当天存量就加 --replay，跑完记得去掉。

[program:selectstock-alert-pusher]
command = /usr/bin/python3 scripts/alert_pusher.py --flush 30
directory = /data/work/SelectStock
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",ALERT_CHANNEL="dingtalk",ALERT_WEBHOOK_URL="",ALERT_WEBHOOK_SECRET=""

autostart = false
autorestart = true
startsecs = 10
startretries = 3
priority = 992

stopsignal = TERM
stopwaitsecs = 20

stdout_logfile = /data/work/SelectStock/logs/alert-pusher.out.log
stderr_logfile = /data/work/SelectStock/logs/alert-pusher.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
