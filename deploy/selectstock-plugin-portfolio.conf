; 持仓诊断插件（8001）：判定与收益公式全在这里，后端只做代理透传（红线 R1）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
; 后端配置 plugin_mode=http + plugin_base_url=http://localhost:8001 指向本进程。
; server.py 自己把仓库根加进 sys.path（复用 stock_selector.backtest.rule_eval），无需额外 PYTHONPATH。

[program:selectstock-plugin-portfolio]
command = /usr/local/bin/uvicorn server:app --host 0.0.0.0 --port 8001
directory = /data/work/SelectStock/stock_selector_api/plugin
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock/stock_selector_api/plugin",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

autostart = true
autorestart = true
startsecs = 10
startretries = 3
priority = 996

stopsignal = TERM
stopwaitsecs = 20

stdout_logfile = /data/work/SelectStock/logs/plugin-portfolio.out.log
stderr_logfile = /data/work/SelectStock/logs/plugin-portfolio.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
