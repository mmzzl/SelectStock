; 选股插件（8002）：真正跑选股内核 run_select() 的 HTTP 适配层，后端只做薄代理（零判定逻辑）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
; 后端配置 selection_plugin_mode=http + selection_plugin_base_url=http://localhost:8002 指向本进程。

[program:selectstock-plugin-selector]
command = /usr/local/bin/uvicorn stock_selector.api:app --host 0.0.0.0 --port 8002
directory = /data/work/SelectStock
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

autostart = true
autorestart = true
startsecs = 10
startretries = 3
priority = 997

stopsignal = TERM
stopwaitsecs = 20

stdout_logfile = /data/work/SelectStock/logs/plugin-selector.out.log
stderr_logfile = /data/work/SelectStock/logs/plugin-selector.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
