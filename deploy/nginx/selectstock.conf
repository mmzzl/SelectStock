# SelectStock 后台 —— nginx 反向代理（挂在 lex_math_new 的 nginx 容器里，独占 8080）
#
# 用法（conf.d 目录属于 lex_math_new 项目，本文件是仓库内的源副本）：
#   cp /data/work/SelectStock/deploy/nginx/selectstock.conf \
#      /data/work/lex_math_new/deploy/nginx/conf.d/selectstock.conf
#   docker exec lexmath-nginx nginx -t && docker exec lexmath-nginx nginx -s reload
# 端口映射需在 /data/work/lex_math_new/docker-compose.yml 的 nginx 服务里保留 "8080:8080"。
#
# 上游是宿主机上 supervisor 托管的 selectstock-api（uvicorn，8010）；
# 容器通过 extra_hosts 的 host.docker.internal 回连宿主机，故不能写 127.0.0.1。
# 静态前端由后端自己挂载托管，这里只做转发，不拆 root。

upstream selectstock_api {
    server host.docker.internal:8010;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # 版本升级中心要上传安装包，与 lexmath 保持一致
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 站内信推送：/ws/notify 长连接，必须透传 Upgrade 且关掉缓冲
    location /ws/ {
        proxy_pass http://selectstock_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://selectstock_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 回测/选股接口本身只投递与查状态，慢的是页面轮询，留足余量即可
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
