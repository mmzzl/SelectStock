# SelectStock 后台 —— nginx 反向代理（挂在 lex_math_new 的 nginx 容器里）
#
# 用法（conf.d 目录属于 lex_math_new 项目，本文件是仓库内的源副本）：
#   cp /data/work/SelectStock/deploy/nginx/selectstock.conf \
#      /data/work/lex_math_new/deploy/nginx/conf.d/selectstock.conf
#   docker exec lexmath-nginx nginx -t && docker exec lexmath-nginx nginx -s reload
# 端口映射需在 /data/work/lex_math_new/docker-compose.yml 的 nginx 服务里保留 "8080:8080"；
# 若把 Cloudflare 隧道的 www.luro.uno 改指 localhost:80，则还需保留 "80:80"。
#
# 上游是宿主机上 supervisor 托管的 selectstock-api（uvicorn，8010）；
# 容器通过 extra_hosts 的 host.docker.internal 回连宿主机，故不能写 127.0.0.1。
# 静态前端由后端自己挂载托管，这里只做转发，不拆 root。
#
# 2026-10-18 加 /qlib/：qlib 插件 8003 绑在 172.17.0.1（docker0），只有容器能连，
# 所以外部要看它必须走这里；带 Basic 认证与 8r/m 限流。密码哈希文件
# conf.d/qlib_plugin.htpasswd 是单独生成的，不在仓库里。

upstream selectstock_api {
    server host.docker.internal:8010;
    keepalive 16;
}

# qlib 选股插件（8003，supervisor 程序 selectstock-plugin-qlib，2026-10-18 常驻）。
# 只绑在 docker0 网关 172.17.0.1，局域网/公网都摸不到，必须经这里转发。
upstream qlib_plugin {
    server host.docker.internal:8003;
    keepalive 2;
}

# 一次打分要 30+ 秒且单进程串行，所以要限流。键用 CF-Connecting-IP（隧道进来的话
# $remote_addr 恒为 docker 网关，所有访客会挤成一个桶）；没这个头时退化成全局一个桶，
# 对本机直连测试来说就是「共享 8 次/分钟」。
# _zone 名带 ip 后缀：nginx 热加载不允许原地改一个已存在 zone 的键
# （日志里会是 emerg「limit_req "qlib" uses ... previously it used ...」，整次 reload 作废，
# 后面的配置一条都不生效）。换个 zone 名就等于新建，reload 能过。
limit_req_zone $http_cf_connecting_ip zone=qlib_ip:1m rate=8r/m;

server {
    # 8080：当前 Cloudflare 隧道把 www.luro.uno 指到 localhost:8080
    # 80  ：同一套反代也挂在 80 端口，供隧道改指 localhost:80 时使用
    #       （80 的默认 server 是 lexmath.conf 的 `server_name _`，
    #        这里用精确 server_name 命中 www.luro.uno，互不干扰）
    listen 8080;
    listen 80;
    server_name www.luro.uno;

    # 版本升级中心要上传安装包，与 lexmath 保持一致
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 站内信推送：/ws/notify 长连接，必须透传 Upgrade 且关掉缓冲
    location /ws/ {
        proxy_pass http://selectstock_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 8003 的运维口只给本机脚本用（收盘后增量更新完面板清它的日历缓存），外面点不着。
    # 更长的前缀先匹配，所以这条比下面的 location /qlib/ 优先。
    location /qlib/api/admin/ {
        return 403;
    }

    # qlib 插件的只读查看口：/qlib/api/health、/qlib/api/strategy/list、/qlib/api/selector/run
    # 这里没有后端那套 JWT，所以用 Basic 认证兜住——`/api/selector/run` 本身不鉴权，
    # 又不加限的话等于对外面敞开一个「人人都能按的 33 秒 CPU 按钮」。
    # 密码哈希在 conf.d/qlib_plugin.htpasswd（不在仓库里，也不含明文）。
    location /qlib/ {
        auth_basic           "qlib plugin";
        auth_basic_user_file /etc/nginx/conf.d/qlib_plugin.htpasswd;
        limit_req            zone=qlib_ip burst=3 nodelay;
        limit_req_status     429;

        proxy_pass http://qlib_plugin/;   # 尾斜杠剥掉 /qlib 前缀：/qlib/api/health -> /api/health
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://selectstock_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 回测/选股接口本身只投递与查状态，慢的是页面轮询，留足余量即可
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
