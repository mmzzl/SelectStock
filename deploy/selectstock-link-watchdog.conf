; 链路看门狗：盯「盘中链路自己还活着吗」（rt:heartbeat / rt:engine-heartbeat 超阈值 → 同一个群说一句）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; 为什么需要它：这条链路坏了的表现是群里变安静，而「安静」和「今天没机会」看起来一模一样。
; 判据与两个进程的 --status 同源；阈值给进程自己声明的休眠让路（退避 60 秒 / 休市 900 秒不算卡死），
; 开盘后 5 分钟内不判故障（心跳键 4 小时 TTL，那几分钟当天心跳可能还没写上）。
; 只在交易时段判断，收盘后静默；重复抑制与恢复通知的状态写在 redis `rt:watchdog`，重启不会重报。
; 渠道与告警进程同源（页面「通知渠道」的 ding_ops），所以要能导入 backend 目录：同机、同解释器。
; 未开 autostart：先在盘内 `--dry-run --rounds 2` 看过它判的东西对不对，再改成 true 并 reread/update。

[program:selectstock-link-watchdog]
command = /usr/bin/python3 scripts/link_watchdog.py --channel-key ding_ops
directory = /data/work/SelectStock
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",ALERT_CHANNEL="dingtalk",ALERT_WEBHOOK_URL="",ALERT_WEBHOOK_SECRET=""

autostart = false
autorestart = true
startsecs = 10
startretries = 3
priority = 993

stopsignal = TERM
stopwaitsecs = 20

stdout_logfile = /data/work/SelectStock/logs/link-watchdog.out.log
stderr_logfile = /data/work/SelectStock/logs/link-watchdog.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
