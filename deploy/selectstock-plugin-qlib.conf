; qlib 选股插件（8003）：与 8002 同契约的 HTTP 服务，打分全在 serving.py，本进程零判定逻辑
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
; 后端切引擎只改一个键：SELECTOR_BASE_URL=http://172.17.0.1:8003（不是 selection_plugin_base_url，那个键新闻与板块也在用）
; 绑 172.17.0.1 而不是 127.0.0.1：对外查看走 lexmath-nginx 容器，它只能经 docker0 网关回连宿主机。
; QLIB_POOL_SOURCE=universe：打分池改成每天 15:55 重算的全市场名单（约 2,881 只），
; 不再是上一次训练冻住的 300 只。缺省是 model；名单文件缺失或为空是硬错，不会静默退回训练池。
; 口径、验收线与代价见 stock_selector/docs/qlib路线数据口径与验收门槛.md §17。
; QLIB_DIP_MODEL_DIR：低开买入榜的模型目录，现指 §45 低吸持有臂 batchH_r1
; （今天的买入判据＝信号日涨 ≥+5% ∩ 明开低于今收；标签＝哪天收盘高过开盘价哪天卖，跌 5% 兜底，上限 10 日）。
; **只有这一个键能开启那条榜**；上一臂 §44 batchG_evt（明开买、当天收盘卖）语义已被用户判掉，指回它只要换回目录名。
; QLIB_MODEL_DIR：线上主榜（`qlib_alpha158`）的模型目录，§46 用户拍板「主榜也换」→ 同一份 batchH_r1。
; 缺省是 `data/qlib/model`（batchW_c3 全市场横截面臂）；指到这里就整条主榜换成低吸臂。
; 两条键现在指同一个目录 ⇒ `dip_artifact()` 判定「同一条榜」，qlib_dip 自动并入主榜、不再单独立一条
; （同一份产物落两套一模一样的 1–30 名次＝假的两条结论）。**删掉 QLIB_MODEL_DIR 这一行并重启 = 主榜换回老臂，
; 那条低开榜同时自己回来**——一行换线、一行回滚。
; 换臂之后主榜的出票人口跟着模型 meta 的 `rule_spec.min_chg` 走（涨 ≥+5% 才进模型），
; 所以名单只数从「全市场 1,273 只排名」变成「当日约 109 只上涨票排名」，非上涨票不再上主榜、
; 持仓页也就查不到它们的名次；代价与验收见 docs §46。
; 注意：这是 .py + env 的改动，必须 restart 本进程才生效（换模型/换名单文件才是不用重启的）。

[program:selectstock-plugin-qlib]
command = /usr/local/bin/uvicorn stock_selector_qlib.api:app --host 172.17.0.1 --port 8003
directory = /data/work/SelectStock
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",QLIB_POOL_SOURCE="universe",PREF_LIST="off",QLIB_MODEL_DIR="/data/work/SelectStock/data/qlib/model_batchH_r1",QLIB_DIP_MODEL_DIR="/data/work/SelectStock/data/qlib/model_batchH_r1"

autostart = true
autorestart = true
startsecs = 10
; qlib 首次导入 + 加载 lightgbm 模型比 8002 慢，默认 3 次重试容易在冷启动时被判定失败
startretries = 5
priority = 996

stopsignal = TERM
stopwaitsecs = 20

stdout_logfile = /data/work/SelectStock/logs/plugin-qlib.out.log
stderr_logfile = /data/work/SelectStock/logs/plugin-qlib.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
