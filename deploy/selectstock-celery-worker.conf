; SelectStock 回测 Celery worker：真正执行回测内核（scripts/backtest_main.py）的进程。
; FastAPI 侧只 send_task + 查状态，不在 Web 进程里跑计算。
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; 前置条件：
;   1. Redis 在 127.0.0.1:6379，任务用 db 3（broker 与 result 同一库，见 backend/config.py 的
;      celery_broker_url / celery_result_backend，可用 .env 覆盖）
;   2. Mongo（lexmath-mongo）可达，内核要从 stock_kline 读 parquet、把结果写回 eastmoney_news
;   3. 内核依赖装在系统 python：pip install -r /data/work/SelectStock/requirements.txt
;      （backend/pyproject 只装 API 侧的 celery/redis/psutil）
;
; concurrency 固定 1：一次回测要整天扫全市场 parquet，多开会把内存吃满；
; 需要并行时另起一个 program 并换成不同的 -Q 队列名。

[program:selectstock-celery-worker]
command = /usr/local/bin/celery -A celery_app worker -l INFO -Q celery -n bt@%%h --concurrency 1
directory = /data/work/SelectStock/stock_selector_api/backend
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock/stock_selector_api/backend",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

autostart = true
autorestart = true
startsecs = 10
startretries = 3
priority = 998

; worker 收到 TERM 会等当前任务跑完再退，回测单轮可能较久
stopsignal = TERM
stopwaitsecs = 120

stdout_logfile = /data/work/SelectStock/logs/celery-worker.out.log
stderr_logfile = /data/work/SelectStock/logs/celery-worker.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
