; SelectStock 回测 Celery worker：真正执行回测内核（scripts/backtest_main.py）的进程。
; FastAPI 侧只 send_task + 查状态，不在 Web 进程里跑计算。
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; 前置条件：
;   1. Redis 在 127.0.0.1:6379，任务用 db 3（broker 与 result 同一库，见 backend/config.py 的
;      celery_broker_url / celery_result_backend，可用 .env 覆盖）
;   2. Mongo（lexmath-mongo）可达，内核要从 stock_kline 读 parquet、把结果写回 eastmoney_news
;   3. 内核依赖装在系统 python：pip install -r /data/work/SelectStock/requirements.txt
;      （backend/pyproject 只装 API 侧的 celery/redis/psutil）
;
; concurrency 固定 1：一次回测要整天扫全市场 parquet，多开会把内存吃满；
; 需要并行时另起一个 program 并换成不同的 -Q 队列名。
;
; 内存治理（2026-10-17）：10-16 那次回测的 prefork 子进程涨到 5.8G 峰值，跑完不回收、5.4G 全压在
; swap 上（swap 只剩 240M），当天 21:32 就把 chrome 和这个 celery 一起送进 earlyoom、随后整机重启。
; `--max-memory-per-child` = 3000000 KB：子进程一过 3G 就在当前任务结束后换新进程，常驻大块没了。
; 为什么没用 cgroup 硬顶（`systemd-run --scope -p MemoryMax=…`）：本 program 以 user=home 运行，
; 非 root 建 transient scope 会被 polkit 挡（实测报 `Interactive authentication required`）。真要
; 硬顶得把 celery 挪进一个 root 管的 systemd unit（带 MemoryHigh/MemoryMax），那是另一次改动。

[program:selectstock-celery-worker]
command = /usr/local/bin/celery -A celery_app worker -l INFO -Q celery -n bt@%%h --concurrency 1 --max-memory-per-child=3000000
directory = /data/work/SelectStock/stock_selector_api/backend
user = home
umask = 022
; QLIB_POOL_SOURCE=universe：qlib 回测与线上 8003 使用同一份每日全市场名单；
; 不设置时默认 model（训练用的 300 只池），结果会标 live_parity=false。
; QLIB_GUARDRAILS=on：与线上同一层薄流动/拉升后阴跌护栏。
environment = PYTHONPATH="/data/work/SelectStock/stock_selector_api/backend",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8",QLIB_POOL_SOURCE="universe",QLIB_GUARDRAILS="on"

autostart = true
autorestart = true
startsecs = 10
startretries = 3
priority = 998

; worker 收到 TERM 会等当前任务跑完再退，回测单轮可能较久
stopsignal = TERM
stopwaitsecs = 120

stdout_logfile = /data/work/SelectStock/logs/celery-worker.out.log
stderr_logfile = /data/work/SelectStock/logs/celery-worker.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
