; SelectStock 调度器（APScheduler 常驻，按 config/inputs.conf 拉起 scripts/*.py）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update

[program:selectstock-scheduler]
command = /usr/bin/python3 /data/work/SelectStock/scheduler/scheduler.py
directory = /data/work/SelectStock
user = home
umask = 022
environment = PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

autostart = true
autorestart = true
startsecs = 5
startretries = 3
priority = 999

stopsignal = TERM
stopwaitsecs = 30

stdout_logfile = /data/work/SelectStock/logs/scheduler.out.log
stderr_logfile = /data/work/SelectStock/logs/scheduler.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
