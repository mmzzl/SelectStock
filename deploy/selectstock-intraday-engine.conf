; 盘中策略计算引擎（tick → 分钟条 → 信号 → 风控 → 决策落盘 + `rt:decisions`）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; 与盘后内核共用 stock_selector/risk 的同一套风控规则，这里只多一个「周期」维度。
; 启动要读日线宽表和风险分模型，所以 startsecs 给到 30；autorestart 会重试，别手动循环拉起。
; max_eval / cooldown 等限流参数在 settings.yaml 的 intraday: 段，不在命令行重复一遍。
; 交易时段外的空转是无害的：没有 tick 就没有决策，代价只是一次 xreadgroup 超时。

[program:selectstock-intraday-engine]
command = /usr/bin/python3 scripts/intraday_engine.py --all
directory = /data/work/SelectStock
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

autostart = true
autorestart = true
startsecs = 30
startretries = 3
priority = 991

stopsignal = TERM
stopwaitsecs = 30

stdout_logfile = /data/work/SelectStock/logs/intraday-engine.out.log
stderr_logfile = /data/work/SelectStock/logs/intraday-engine.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
