; SelectStock 后台 API（FastAPI；无构建前端由同一进程的静态挂载托管）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; 端口：文档约定 8000，但本机 8000 已被 /data/work/lex_math_new/backend 占用，故改用 8010。
;       换端口只改下面 --port；uniapp / 外部调用方的 base_url 需同步。
; 单进程：APScheduler 与 /ws/notify 都在 Web 进程内，加 --workers 会重复调度，故不开。
; 密钥：JWT_SECRET 从 stock_selector_api/.env 读取（该文件不入库）；缺失时启动日志会告警。

[program:selectstock-api]
command = /usr/local/bin/uvicorn main:app --host 0.0.0.0 --port 8010
directory = /data/work/SelectStock/stock_selector_api/backend
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock/stock_selector_api/backend",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

autostart = true
autorestart = true
startsecs = 10
startretries = 3
priority = 995

stopsignal = TERM
stopwaitsecs = 20

stdout_logfile = /data/work/SelectStock/logs/api.out.log
stderr_logfile = /data/work/SelectStock/logs/api.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
