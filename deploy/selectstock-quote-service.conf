; 盘中行情上行（快照轮询 → redis `rt:quote` / `rt:ticks`）
; 仓库内留副本；生效：sudo cp 本文件 /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
;
; 股票池：--from-app 只盯「最近一次选股命中 + 当前持仓」（读 app.db，约 360 只，换日自动重取）。
;         360 只 ÷ 每请求 60 只 = 一拍 6 个请求，所以间隔敢给到 5 秒；原先的 --all --interval 15
;         是 111 个请求/15 秒，配额压力反而大 6 倍。要回全市场口径就改 `--all --interval 15`。
;         interval 给 5 秒已经是这条链路的合理下限：免费接口没有频率承诺，再快是自找封 IP。
; 只上行数据、不做判定：停掉它下游引擎只是收不到新 tick，不会误判。

[program:selectstock-quote-service]
command = /usr/bin/python3 scripts/quote_service.py --from-app --interval 5
directory = /data/work/SelectStock
user = home
umask = 022
environment = PYTHONPATH="/data/work/SelectStock",PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

autostart = true
autorestart = true
startsecs = 20
startretries = 3
priority = 990

stopsignal = TERM
stopwaitsecs = 20

stdout_logfile = /data/work/SelectStock/logs/quote-service.out.log
stderr_logfile = /data/work/SelectStock/logs/quote-service.err.log
logfile_maxbytes = 20MB
logfile_backups = 5
