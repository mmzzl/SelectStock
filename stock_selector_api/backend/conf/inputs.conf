# ============================================================
# 定时任务配置文件（参考产品 inputs.conf 约定）
# 每次启动时由 scheduler 解析并注册到 APScheduler
#
# 支持的节：
#   [task://module:func]     -> 本模板内的异步任务（推荐）
#   [script://path 参数]      -> 外部脚本（当前版本不自动执行，预留）
#   [daemon://name]          -> 常驻进程（当前版本不自动执行，预留）
#
# enable = true/false          是否启用
# interval = 300s/10m/2h/1d    固定间隔触发
# cron = hour=23,minute=49     cron 表达式（second/minute/hour/day/month/week/dow）
# interval 与 cron 二选一，同时出现时 interval 优先
# ============================================================

[task://device_health:device_health_check]
enable = true
title = 设备状态巡检
# 每 5 分钟执行一次
interval = 300s
# 或者每天 2:30: # cron = hour=2,minute=30,second=0
