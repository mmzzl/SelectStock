# 同 qlib_workflow_default.yaml，唯一区别是票池换成 **csi300**（本地成分股快照建的，320 只）。
# 目的是看 qlib 默认配置在它自己的票池口径下报多少 IC。
# ⚠ 前视偏差：`data/csv/hs300_stocks.csv` 是 2026-05-24 的**单日快照**、无进出成分日期，
#   拿它跑 2015→2026 = 用"今天已经长大才被选进指数的票"回测十年前 ⇒ 读数系统性偏高，
#   只能当「官方口径长什么样」的参照，不能用来裁决线上换不换（裁决看 qlib_run.py 那条按训练段挑池的链）。
# 建池：`python3 scripts/qlib_make_index_pool.py --index hs300`
qlib_init:
    provider_uri: /data/work/qlib_data/cn
    region: cn
    kernels: 1
    uri: /data/work/SelectStock/data/qlib/mlruns_default
market: &market csi300
benchmark: &benchmark SH510300
data_handler_config: &data_handler_config
    start_time: 2015-01-01
    end_time: 2026-10-16
    fit_start_time: 2015-01-01
    fit_end_time: 2020-12-31
    instruments: *market
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 12
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2015-01-01, 2020-12-31]
                valid: [2021-01-01, 2022-12-31]
                test: [2023-01-01, 2026-10-16]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
