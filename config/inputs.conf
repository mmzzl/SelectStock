[script://scripts/build_kline_features.py]
enable = true
cron=hour=18,minute=00

# 资金流采集（任务 #171 阶段 1）：东财全市场单日批量 → data/fund_flow/daily/ 按交易日期分区。
# 为什么是 16:30：
#   1) 盘后、且避开盘中限流——批量接口只给「当天」，收盘后一过就取不到那天，准点是硬要求；
#   2) 排在 15:45 的 merge_snapshot_amount 之后，补抓/迁移要的成交额那时才并回日线；
#   3) 旧版排在 18:00，与 build_kline_features 并发抢同一个数据源连接。
# 实测整轮 60 页约 40~60 秒，外加有界补抓（默认每轮 40 只，节流严重时更久）。
# 断采会自检并推钉钉（同一天只推一条）；口径见 stock_selector/docs/资金流数据口径与防前瞻红线.md
[script://scripts/fetch_fund_flow.py]
enable = true
cron=hour=16,minute=30

# 板块热力图：读 build_kline_features 的产物，必须排它后面（它 18:00 起，增量约 1~2 分钟）
[script://scripts/build_sector_heat.py]
enable = true
cron=hour=18,minute=30

# 判定记账台账：读日线 parquet + member.parquet，所以排在热力图之后（留 30 分钟余量，全量 90 秒）
[script://scripts/build_judgement_ledger.py]
enable = true
cron=hour=19,minute=00

# shadow 台账：adx14 闸门两臂 × 收盘/次开盘两种成交假设，shadow 期唯一的验收依据。
# 排在判定台账之后（同为全市场逐日重算，两者读的是同一批 parquet，别并发）；
# 只写 data/shadow_ledger/ 下的文件，**不改任何下单行为**（闸门是 shadow 模式）。
[script://scripts/build_shadow_ledger.py --days 120]
enable = true
cron=hour=19,minute=40

[script://scripts/analyze_news_llm.py --limit 500]
enable = true
cron=hour=22,minute=00

[script://scripts/kline_spider.py]
enable=true
cron=hour=15,minute=10

# 盘后全市场快照：收盘后交易所口径的涨跌停价/换手率/成交额，风控的成交性与流动性规则靠它
# 排在 kline_spider 之后（同一个数据源，别并发抢连接）；整轮实测 12 秒
[script://scripts/fetch_market_snapshot.py]
enable=true
cron=hour=15,minute=30

# 把快照里的精确成交额并回当天日线：日线两个源都不给 amount，只能事后补。
# 必须排在快照之后、build_kline_features（18:00）之前；--days 5 是为了自愈——
# 爬虫按「只写比库里最新更靠后的 K 线」增量，哪天少抓了一批，后面几天再补进来时
# 那几天的行才刚建好，往回合并 5 天就能把成交额一起补齐。实测 3 个交易日 1.5 秒。
[script://scripts/merge_snapshot_amount.py --days 5]
enable=true
cron=hour=15,minute=45

[script://scripts/news_spider.py]
enable=true
interval = 30s

# 可信度（剧本成功率）样本：全市场逐日打「后10日先触 −5% 还是 +10%」三层障碍标签。
# 读 build_kline_features 产的日线 parquet（pos60/vol_ratio/…），必须排在它（18:00）之后；
# 实测 6631 文件 / 1066 万行 103 秒，产物 data/conviction/samples.parquet。
[script://scripts/build_conviction_samples.py]
enable = true
cron=hour=20,minute=00

# 可信度模型：LightGBM + 净化滑动窗口（折间 25 自然日 embargo、验证内按 seq%10 去重叠）
# + 分位分箱加权 PAVA 校准，产物 data/conviction/conviction_model.{lgb.txt,json}。
# 插件按文件 mtime 缓存，重训完自动换模型、不用重启进程。实测全程 110 秒。
# 旧的 build_conviction_table.py（81 格 Beta 表）口径已被本模型取代，不再排调度。
[script://scripts/train_conviction_model.py]
enable = true
cron=hour=20,minute=10

